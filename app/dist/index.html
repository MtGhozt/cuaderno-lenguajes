    <script type="module" crossorigin>(function(){const e=document.createElement("link").relList;if(e&&e.supports&&e.supports("modulepreload"))return;for(const n of document.querySelectorAll('link[rel="modulepreload"]'))o(n);new MutationObserver(n=>{for(const s of n)if(s.type==="childList")for(const r of s.addedNodes)r.tagName==="LINK"&&r.rel==="modulepreload"&&o(r)}).observe(document,{childList:!0,subtree:!0});function i(n){const s={};return n.integrity&&(s.integrity=n.integrity),n.referrerPolicy&&(s.referrerPolicy=n.referrerPolicy),n.crossOrigin==="use-credentials"?s.credentials="include":n.crossOrigin==="anonymous"?s.credentials="omit":s.credentials="same-origin",s}function o(n){if(n.ep)return;n.ep=!0;const s=i(n);fetch(n.href,s)}})();const j=[{id:"u1",num:"Unidad 1",title:"Fundamentos y conceptos generales",objectives:["Definir algoritmo como procedimiento efectivo.","Enunciar la tesis de Church-Turing.","Aplicar el teorema de Böhm-Jacopini.","Explicar universalidad, implementabilidad y naturalidad.","Distinguir sintaxis, semántica y pragmática.","Clasificar datos simples y compuestos."],sections:[{h:"Algoritmo y procedimiento efectivo",body:`Un **algoritmo** es un conjunto de tareas finitas que se llevan a cabo sobre un grupo finito de datos, en un tiempo finito y usando recursos finitos.

Un **procedimiento efectivo** es la noción intuitiva detrás: un proceso computable por medios finitos y definidos. Es válido si cumple 4 reglas [Apuntes Jorge]:

- Ejecuta un número finito de tareas no ambiguas
- Utiliza un número finito de recursos y pasos
- Produce el mismo resultado siempre con la misma entrada (determinista)
- No requiere ingenio, intuición ni magia: se ejecuta siguiendo pasos

Cadena del curso: **Proceso Efectivo → Función Parcialmente Computable → Algoritmo**.

La **tesis de Church-Turing** afirma que toda función computable es **Turing-computable**: todas las formas de computabilidad son equivalentes (Church puso a Turing, su doctorando, a demostrar que sus funciones parcialmente computables equivalían a los algoritmos de Turing). Por eso un lenguaje de programación, como representación de algoritmos, debería ser Turing-computable.`},{h:"Böhm-Jacopini: las cuatro estructuras",body:`Corrado Böhm y Giuseppe Jacopini demostraron un teorema sobre computabilidad de Turing aplicable a **cualquier paradigma**: cualquier algoritmo puede construirse con cuatro tipos de estructuras de ejecución:

- Ejecución secuencial
- Iteración
- Ejecución condicional
- Separación modular`},{h:"Principios de diseño: propósito, desarrollo, hardware",body:`Todo lenguaje de propósito general es **Turing completo**, pero cada uno tiene un **propósito** (ecuaciones, conocimiento, gráficos 3D, contabilidad): la tarea se facilita si el lenguaje es afín al dominio.

El software vive décadas: habrá bugs, funciones nuevas y migraciones; el diseño debe facilitar ese mantenimiento lo antes posible. Y el hardware evoluciona (vectores, hilos): el lenguaje debe exponer esas ventajas.

Wirth lo resume: **Algorithms + Data Structures = Programs**. Todo lenguaje debe representar algoritmos y datos.`},{h:"Características deseables I: universalidad, implementabilidad, naturalidad",body:`**Universalidad**: implementar cualquier algoritmo (Turing completo; en la práctica: recursión o pilas).

**Implementabilidad**: cada instrucción, simple o compuesta, se traduce de forma **exacta** a la máquina-objeto, en cualquier procesador.

**Naturalidad**: pensar fácilmente en el dominio sin perder universalidad. Por eso siguen naciendo lenguajes: no es lo mismo contabilidad que control de un radiotelescopio.`},{h:"Características deseables II: no-ambigüedad, eficiencia, depurabilidad, seguridad",body:`**No-ambigüedad**: sin las ambigüedades del lenguaje natural, pero con ambigüedades formales propias (se resuelven con reglas metalingüísticas):

- **Dangling else**: ¿a qué \`if\` pertenece ese \`else\`?
- **Conversiones**: en \`r = m*i + s\` (reales + entero i), ¿qué se evalúa y convierte primero?

**Eficiencia**: deseable, pero relativizable ante portabilidad o claridad. Una máquina virtual como intérprete cuesta rendimiento y a veces se asume igual. [POR-VERIFICAR: "siempre es ineficiente" es un absoluto]

**Depurabilidad**: debe existir una correspondencia clara diseño ↔ implementación ↔ depuración.

**Seguridad (tríada CIA)**: privacidad, disponibilidad, integridad. Algunos lenguajes la incorporan (excepciones de Java, modelos Bell-LaPadula y Biba).`},{h:"Sintaxis, semántica y pragmática",body:`**Sintaxis**: reglas para formar expresiones válidas (gramática, usualmente libre de contexto). El compilador la verifica.

**Semántica**: cómo se espera que el programa se comporte al ejecutarse (ej. el \`while\` de Pascal ejecuta 0 o más veces).

**Pragmática**: cómo se usa en la práctica; el programador la comunica con nombres significativos y comentarios. Cuatro usos típicos de la asignación:

\`\`\`text
x := E   -- 1) temporal: calcular una vez y reutilizar
         -- 2) comunicar valores entre partes (parámetros/mensajes)
         -- 3) modificar una estructura de datos
         -- 4) acumular en un cálculo iterativo
\`\`\``},{h:"Datos: simples y compuestos",body:`Los datos son **valores**. Simples: dados por el hardware (enteros complemento a 2, flotantes IEEE 754) o basados en enteros (booleano, caracteres, enumerados, BCD, direcciones).

Compuestos: **producto cartesiano** C1 × C2 × … × Cn (ej. registro con código, descripción, fechas y valores), arreglos de n dimensiones, **listas y tipos recursivos**, árboles, uniones y archivos.

| Tipo | Ejemplo |
|---|---|
| Simple por hardware | Entero comp-2, flotante IEEE 754 |
| Simple basado en enteros | Booleano, carácter, enumerado |
| Compuesto | Record/struct, array, lista, árbol, unión, file |`},{h:"Computabilidad parcial y por qué estudiar paradigmas",body:`Algunas funciones son **parcialmente computables**: f(x) = √x es exacta en E = {0,1,4,9,16,…} y solo aproximada fuera. Ni siquiera la identidad es exactamente computable para todos los reales con recursos finitos.

Distinción de los Apuntes de Jorge:

- **Computables completos**: existe un algoritmo que para **cualquier entrada** calcula, arroja el resultado correcto y se detiene.
- **Parcialmente computables**: solo garantizan detenerse con **entrada válida**; con entrada inválida nunca encuentran salida (bucle infinito).

Definición formal: una función parcialmente computable es aquella donde, para valores dentro de su dominio, existe una **Máquina de Turing M que se detiene en pasos finitos** con el resultado correcto; fuera del dominio, **M diverge** (nunca se detiene).

Cada paradigma da **herramientas mentales** distintas para expresar algoritmos: lo mismo que el salto de ensamblador a alto nivel no añadió potencia pero cambió cómo se piensa. Un paradigma es un marco de referencia para interpretar problemas (si solo tienes un martillo, todo parece un clavo). El curso debería llamarse, con más precisión, **paradigmas de programación**: formas de entender qué es computable.`},{h:"Cálculo Lambda vs Máquina de Turing [Apuntes Jorge]",body:`Dos caminos distintos al mismo poder de cómputo:

- **Cálculo Lambda (Church)**: sistema formal basado en **aplicación de funciones** donde se evalúa por **sustitución** (no por asignación en memoria). Es la base de los lenguajes **funcionales**.
- **Máquina de Turing**: máquina hipotética donde un **lector lee casillas de una cinta** y con estados y reglas ejecuta instrucciones hasta llegar a **halt** (detenerse). Es la base de los lenguajes **imperativos**.

Los 4 paradigmas del curso:

- **Imperativo/procedimental**: tareas como ejecución de instrucciones (órdenes).
- **Funcional**: tareas como evaluación de funciones.
- **Lógico**: tareas como evaluación de predicados de verdad.
- **Orientado a objetos**: ~ (II Parcial).`},{h:"Características obligatorias y deseables [Apuntes Jorge]",body:`**Obligatorias:**

- **Universales**: implementar cualquier algoritmo (ser Turing completo; en la práctica: implementar pila y recursión).
- **Implementables**: cada instrucción se traduce **exactamente a la misma instrucción máquina-objeto**, sin importar la arquitectura del procesador.
- **No ambiguos**: cada instrucción ejecuta específicamente lo pensado por el creador.

**Deseables:**

- **Naturales**: pensar fácilmente en el dominio específico.
- **Eficientes**: estructuras que el compilador procese rápido.
- **Depurables**: biyección entre diseño e implementación (ver qué código corresponde a cada concepto).
- **Seguros**: tríada CIA (privacidad, disponibilidad, integridad).`},{h:"Datos simples y compuestos, detalle [Apuntes Jorge]",body:`**Simples (2 familias):**

- Basados en hardware: **BCD, enteros Comp-2, punto flotante**.
- Basados en enteros: **booleanos, caracteres, enumerados**.

**Compuestos:** producto cartesiano, **array, lista, unión, file**.

| Tipo | Ejemplo |
|---|---|
| Simple por hardware | Entero comp-2, flotante IEEE 754, BCD |
| Simple basado en enteros | Booleano, carácter, enumerado |
| Compuesto | Record/struct, array, lista, árbol, unión, file |`},{h:"Timeline de lenguajes + Costa Rica [Apuntes Jorge]",body:`- **Fortran (1954, Backus, IBM)**: primer propósito general (Turing completo), paradigma imperativo; hoy física.
- **Lisp (1958, McCarthy, guía Church)**: base en listas, primer funcional; investigación en IA.
- **Scheme (1975)**: subproducto más exitoso de Lisp.
- **Algol 58**: abuelo de C y derivados; formalizar el pseudocódigo.
- **COBOL (1959)**: negocios, archivos y E/S, inglés; programas financieros.
- **PL/1 (IBM)**: mezcla COBOL + Fortran + Algol 58.
- **Simula (1964, Noruega, energía nuclear)**: introduce la orientación a objetos.
- **Logo (1968)**: enseñar algoritmos a niños.
- **Smalltalk (1969 Xerox, def. 1980)**: cúspide de la OO.
- **Prolog (1970)**: sentencias lógicas ejecutables por computadora.
- **C (1972)**: lenguaje para programar UNIX.
- **Pascal**: con C, descendiente de Algol; bueno y enseñable.
- **Basic (1964 admins → 1975 Microsoft Basic → Visual Basic)**.
- **sh**: intérprete UNIX, secuencias de comandos → scripting.
- **Perl**: scripting independiente del SO; con sh son "blue languages", primer intento multiparadigma.

**Costa Rica en los 60**: IBM rentaba (no vendía); las **instituciones públicas** rentaron primero, lo que sostuvo el estado desarrollista (banca, electricidad, agua) gestionando grandes datos.`},{h:"Criterios de evaluación: legibilidad, escritura, confiabilidad [Guía Jorge]",body:`Diseñar es elegir **compromisos (trade-offs)**: no existe el lenguaje perfecto. Tres criterios clásicos:

- **Legibilidad**: deducir el comportamiento inspeccionando el código (simplicidad, ortogonalidad, control claro).
- **Facilidad de escritura (writability)**: expresar algoritmos con naturalidad (abstracción, expresividad).
- **Confiabilidad**: comportarse según lo especificado (chequeo de tipos, excepciones, poco aliasing).

La **ortogonalidad** (pocas reglas especiales, todo combina con todo, ej. Algol 68) favorece la confiabilidad; en C clásico es baja (arreglos, parámetros y asignación con casos especiales).`},{h:"Gramáticas BNF y ambigüedad formal [Guía Jorge]",body:"Una gramática libre de contexto es la 4-tupla **G = (V_N, V_T, P, S)**: no terminales, terminales, producciones y símbolo inicial. Es **ambigua** si alguna cadena tiene dos o más árboles de derivación.\n\nEl dangling else se resuelve formalmente partiendo en sentencias **cerradas (matched)** y **abiertas (open)**:\n\n```text\nMatchedStmt → if Expr then MatchedStmt else MatchedStmt | otro\nOpenStmt    → if Expr then Stmt\n             | if Expr then MatchedStmt else OpenStmt\n```\n\nY la gramática aritmética `E → E+E | E*E | id` se desambigua por niveles: `E → E+T | T`, `T → T*F | F`, `F → id | (E)` (el producto ata más fuerte; recursión izquierda = asociatividad izquierda)."},{h:"Del carácter al token y del chequeo a la ejecución [Guía Jorge]",body:`Las capas del lenguaje, de lo físico al contexto: fonética (bits), fonología (caracteres/UTF-8), **morfología** (léxico/tokens), sintaxis (AST), semántica (tipos/ejecución), pragmática (propósito).

La morfología vive en el **scanner**: agrupa caracteres en tokens. Los errores se clasifican por capa:

| Ejemplo | Capa |
|---|---|
| \`int 9valor = 50;\` | Léxico |
| \`if (a > 0 then x = 1;\` (falta paréntesis) | Sintáctico |
| \`int *p = 3.14159;\` | Semántico estático [en C suele ser aviso, no error] |
| \`int x = 10 / 0;\` | Semántico dinámico [en C es indefinido, no excepción uniforme] |

**Semántica estática** = lo validable compilando (tipos, ámbitos). **Dinámica** = el significado al ejecutar y cómo se transforma la memoria.`}]},{id:"u2",num:"Unidad 2",title:"Programación imperativa: COBOL, Pascal, C",objectives:["Explicar la ejecución imperativa como órdenes.","Comparar COBOL, Pascal y C.","Clasificar variables por tiempo de vida.","Describir la programación estructurada.","Distinguir acoplamiento de cohesión.","Implementar control con instrucciones.","Distinguir función de procedimiento."],sections:[{h:"La idea: tareas como órdenes",body:`En lo imperativo, **tareas = instrucciones** que se llevan a cabo con **ejecución imperativa**: en el fondo son **órdenes** y se tienen que ejecutar cada una de ellas. Es el paradigma más antiguo y sigue influyendo en la OO; hay mucho legacy en mantenimiento, pero ya no salen lenguajes nuevos.

Características comunes [Apuntes Jorge]:

- Variables como **grupos consecutivos de bytes**, declaración explícita.
- **Array** casi único compuesto; el resto se construye manual con constructos.
- Control con **instrucciones**: secuencia por orden del archivo, condicional if-else, iteración for-while.
- **Fuerte separación entre datos y módulos de código**.
- Al inicio no se podía compartir código; cada compilador hacía lo suyo, dialectos y excepciones engorrosas.`},{h:"COBOL vs Pascal vs C",body:`| | COBOL | Pascal | C |
|---|---|---|---|
| Reservadas (clase) | 90 y pico [POR-VERIFICAR] | 14 [POR-VERIFICAR] | 14 [POR-VERIFICAR] |
| Llamadas | Sin calls: salto al "párrafo" | — | — |
| Anidadas | — | Funciones anidadas sí | No permite anidadas |
| Asignación / comparación | — | := vs = [nota: el cuaderno invierte los símbolos, por verificar] | = vs == |
| Archivos | Bien (archivo e índice) | Mal | Mal (ajenos al lenguaje) |

Crítica de clase: COBOL incapaz de estructuras dinámicas, "verbose", crecimiento y dialectos, curva larga; C inseguro en situaciones límite (pila ingenua, punteros libres); Pascal con E/S en el lenguaje pero salidas abruptas engorrosas.`},{h:"Tiempo de vida, binding y programación estructurada",body:`El **life span** va con el módulo: las **locales** mueren con él (viven en **pila/registro**); las **globales** viven como el programa (en el **data segment**, estáticas); las **dinámicas** viven en el **heap** (Garbage Collector). Hay variables que viven más que su programa, como los **archivos**.

**Binding** es asociar un identificador con su valor en memoria [Apuntes Jorge]:

- **Estático**: el tipo queda grabado de inicio a fin; típico de compilados (ej. Java).
- **Dinámico**: el tipo se revisa en cada uso en ejecución; típico de interpretados (ej. Python).

La **programación estructurada** (nombre que toma lo imperativo a fines de los 60) separa funcionalidades en módulos porque **un humano va a revisar el código**: se busca legibilidad. Tiene un **main**: módulo estructural en columna al que todos convergen. Y un módulo **no debe exceder una página**.`},{h:"Acoplamiento y cohesión",body:`**Coupling**: qué tan enlazados están dos módulos; se busca **bajo**.

**Cohesión**: coherencia semántica interna (si calcula, solo calcula; si muestra, solo muestra); se busca **alta**. [POSIBLE CONFUSIÓN: el cuaderno rotula esto como "Binding"; binding es asociación de nombres, no cohesión]`},{h:"Datos compuestos y control",body:'El **array** es casi el único compuesto (a veces "string"); el resto se construye a pie y se pierde uniformidad. El **producto cartesiano** es `record` (Pascal), `struct` (C) o **nivel 01** (COBOL):\n\n```cobol\n01 Empleado\n   03 Nombre   PIC X(50)\n   03 Fecha-Nac\n      05 Dia-Nac  PIC 9(2)\n      05 Mes-Nac  PIC 9(2)\n      05 Anno-Nac PIC 9(2)\n```\n\nControl con instrucciones: secuencia (`b := m`, `r := n`), `if`, `case/switch`, `for` (→ `perform` en COBOL), `while` (pregunta antes) y `repeat/do-while` (hace y después pregunta). **Recursión simple** (A se llama) y **mutua** (A → B).'},{h:"Módulos y representación",body:`**Procedimiento**: crea extensiones del lenguaje (instrucciones nuevas); no devuelve valor, solo afecta valores ya en memoria. **Función**: encapsula expresiones y **retorna un valor** según parámetros de entrada [Apuntes Jorge].

Para representar algoritmos: **pseudocódigo** y **diagramas de Nassi-Shneiderman** (estructurados: secuencia, condición, repetición). Diagramas de flujo: **no usarlos** (clase).`},{h:"Problemas por lenguaje y qué mató a los imperativos [Apuntes Jorge]",body:`**COBOL**: incapaz de estructuras dinámicas; "verbose" (tan parecido al inglés que oculta el algoritmo); el lenguaje no paraba de crecer (curva larga).

**Pascal**: E/S con instrucciones del lenguaje; salidas abruptas de ciclos por excepciones, incómodas.

**C**: inseguro e inestable en límites (pila ingenua, punteros libres); archivos grandes exigen importar bibliotecas; efectos colaterales en E/S: una lectura devuelve el valor **y** el código de error: \`if ((a = get(file)) != 0)…\`.

Lo que los mató: **ninguno permite compartir la definición de una estructura (su modelo) junto con los algoritmos para usarla**. De ahí la OO.`},{h:"Paso de parámetros: valor, referencia y nombre [Guía Jorge]",body:"- **Valor**: copia; no afecta al original.\n- **Referencia**: dirección; muta lo externo (aliasing).\n- **Nombre** (Algol 60): sustitución textual; se **reevalúa en cada uso** en el ámbito llamador.\n\nEl **Dispositivo de Jensen** (`Sum(k, lower, upper, expr)` con `value lower, upper`) expresa Σ A[i]: `expr` se evalúa cada ciclo con el nuevo k. Potente, costoso y sorprendente."},{h:"Del goto al while [Guía Jorge]",body:"Todo salto se reduce a `while` + `if` con **bandera booleana** (única entrada y salida). El ejercicio resuelto convierte un programa con `goto 10/40/60` en:\n\n```pascal\ncontinuar := true;\nwhile continuar do\nbegin\n    leer(x);\n    if x = -999 then continuar := false\n    else if x < 0 then imprimir('Error: numero negativo')\n    else begin y := sqrt(x); imprimir(y); end;\nend;\nimprimir('Fin del programa');\n```"}]},{id:"u3",num:"Unidad 3",title:"Programación funcional: Scheme y Haskell",objectives:["Leer notación prefija y cálculo lambda.","Definir funciones en Scheme.","Definir funciones en Haskell con tipos y pattern matching.","Usar funciones de orden superior sobre listas.","Explicar polimorfismo paramétrico.","Predecir evaluaciones eager vs. orden-normal.","Definir estrictez, Church-Rosser y evaluación perezosa."],sections:[{h:"La idea: todo es función",body:`Un algoritmo funcional es un **conjunto finito de funciones que se evalúan un número finito de veces con recursos finitos**. Se descompone en funciones más sencillas combinadas con operadores; ejemplo guía del curso: el mínimo común múltiplo como función de MCD.

\`\`\`text
mcm(n,m) = (n × m) / MCD(n,m)
MCD(n,m) = { si (n = qm + r, r = 0): m
             si no: MCD(m, r)
\`\`\`

Aquí ya se ven las 4 estructuras de Böhm-Jacopini: secuencia (primero MCD), módulos (mcm invoca MCD), condicional (definición a trozos) y ciclo (recursión).

**Nacimiento [Apuntes Jorge]**: el más viejo (Cálculo Lambda de Church). En los 30 la intuición ya no bastaba para hacer matemática; se buscó un proceso metodológico para verificar verdad por demostración. Church mostró que **es imposible un algoritmo que demuestre cualquier sentencia**; Turing respondió con su máquina. La **función parcialmente computable** resultante es la base del paradigma.

6 conceptos fundamentales: modelo por **evaluación de funciones**, **expresiones** como bloques, **funciones** como abstracciones de primera clase, **polimorfismo paramétrico**, **abstracción de datos** y **evaluación perezosa** (evaluar al necesitar y reutilizar).`},{h:"Cálculo lambda y notación prefija (Scheme)",body:`Scheme hereda la sintaxis del **cálculo lambda**: toda llamada es una lista cuyo primer elemento es el operador.

\`\`\`scheme
(f a1 a2 ... an)
(+ a (* b c))   ; a + b*c
(+ a b (- c))   ; resta como suma del negativo
\`\`\`

Esto fija la precedencia por construcción, a costa de legibilidad: razón por la que existen más lenguajes funcionales.`},{h:"Scheme: define, lambda, quote, listas",body:`\`\`\`scheme
(define (mcm a b) (/ (* a b) (mcd a b)))  ; definir función
(lambda (x) (* x x))                      ; función sin nombre
(quote (5 2 3 0 20))                      ; dato literal, no llamada
(car '(5 2 3))   ; → 5 (cabeza)
(cdr '(5 2 3))   ; → (2 3) (cola)
\`\`\`

Las **variables no son celdas de memoria**: son lugares del programa que al evaluarse se vuelven constantes. No hay instrucción de asignación; el único compuesto es la **lista**. El parser del lenguaje resulta muy sencillo.`},{h:"Proy/Cond y variables inmutables [Apuntes Jorge]",body:"En matemática una función es una **relación (ley) entre 2 conjuntos**: un subconjunto del **producto cartesiano** que cumple un predicado. La lógica se enfoca en la **propiedad/predicado**, y el Cálculo Lambda usa esa vía lógica. Hay suma, resta, composición, derivación y **recursividad** entre funciones.\n\n**Condicional funcional** con proyección: `Proy(k, a1,…,an)` retorna el k-ésimo (ej. `Proy(1,3,5,8) = 3`). Con ella:\n\n```text\nCond(t, a, b) = si t es verdadera → a, si no → b\nMCD(m,n) = Cond(n mod m = 0, m, MCD(m, n mod m))\n```\n\n**Variable**: no es celda de memoria; es un **identificador vinculado permanentemente a un valor o expresión**, nunca muta."},{h:"Haskell: tipos, listas y pattern matching",body:`Haskell declara tipos en el encabezado (el último es el retorno) y usa pattern matching en vez de condicionales:

\`\`\`haskell
hailstoneSeq 1 = [1]   -- caso base directo, sin if
hailstoneSeq n = n : resto

-- listas homogéneas: X:xs (cabeza X, cola xs)
longitud [] = 0
longitud (_:xs) = 1 + longitud xs   -- _ : variable anónima

-- encabezado con tipos (el último es el retorno) [Apuntes Jorge]
-- sumaprod :: int -> int -> int -> int
-- sumaprod a b c = a + (b * c)

-- construir con [] y (:): 1:[] = [1]; 2:(1:[]) = [2,1]
-- en Haskell todo elemento debe ser del mismo tipo (en Scheme no)
\`\`\`

\`Int\` es entero de 32 bits; \`Integer\` es precisión arbitraria pero más lento. \`main\` usa \`IO ()\` para interactuar (ej. \`print\`). Para matemática rigurosa, Haskell supera a los imperativos.`},{h:"Primera clase y polimorfismo paramétrico",body:"Las funciones son **habitantes de primera clase**: se pasan como argumentos (ej. aplicar una función a cada elemento de un vector) y se retornan.\n\n**Polimorfismo paramétrico**: la función no restringe a priori el tipo de sus argumentos. Haskell lo sostiene con clases de tipos (Int y Float como cantidades) y evaluación que respeta los tipos; `otherwise` equivale al `else`, `==` compara y `=` define."},{h:"Estrategias de evaluación",body:"**Eager**: el argumento se evalúa una vez en la llamada y se sustituye su valor.\n\n**Orden-normal**: se evalúa solo cuando se requiere (puede repetirse). En `sqr(n) = n*n` con n=m+1, orden-normal evalúa (m+1) dos veces: mismo resultado, menos eficiente.\n\n**Perezosa (lazy)**: orden-normal + memoización; lo mejor de ambos mundos, válida por **Church-Rosser**.\n\nEl ejemplo `cand(b1,b2) = if b1 then b2 else False` con `cand((n>0),(t/n>50))`, n=0: eager **divide por cero y falla**; orden-normal devuelve `False` sin evaluar el segundo argumento."},{h:"Estrictez y Church-Rosser",body:"Una función es **estricta** en un argumento si siempre lo usa: `sqr` es estricta en n; `cand` solo en el primero.\n\n**Church-Rosser**: si una expresión puede evaluarse, el orden-normal la evalúa consistentemente; todos los órdenes dan el mismo resultado. La tienen Haskell (y algo de Prolog); C la pierde por **efectos laterales** (ej. `getint`). Por eso lo imperativo/OO usa eager y lo funcional usa lazy."},{h:"Currificación, TCO y funciones puras [Guía Jorge]",body:"**Currying**: `A → B → C` es `A → (B → C)`; dar un argumento devuelve otra función. Así `duplicar = (*) 2` (aplicación parcial).\n\n**TCO**: si la llamada recursiva es lo **último** (nada pendiente, como en `factAux` con acumulador), el marco se reutiliza: O(1). En `n * fact(n-1)` la multiplicación lo impide.\n\nFunción **pura**: determinista, sin efectos, transparente (`f(2)` siempre 4). Por eso lo puro paraleliza sin locks y admite **memoización** segura."},{h:"Listas infinitas, Collatz y orden superior [Guía Jorge]",body:'Con lazy, `[1..]` existe y `take 10 enteros` solo calcula lo pedido. `String` es `[Char]`: `take 4 "Programacion"` da "Prog".\n\n**Collatz** (conjetura, 1937): par → n/2, impar → 3n+1. Para 6: [6,3,10,5,16,8,4,2,1] (9 pasos, altura 16).\n\n```haskell\nmap (\\x -> x * 2) [1,2,3]      -- [2,4,6]\nfilter even [1,2,3,4,5,6]       -- [2,4,6]\nparesHailstone n = filter even (hailstoneSeq n)\n```'}]},{id:"u4",num:"Unidad 4",title:"Programación lógica: Prolog",objectives:["Distinguir relaciones de funciones.","Explicar hechos, consultas y FBF.","Describir la ejecución como demostración.","Explicar el sistema de Copi y sus alternativas.","Contrastar variable lógica e imperativa."],sections:[{h:"La idea: sentencias que se demuestran",body:`La **lógica** es la disciplina de los métodos para distinguir un argumento bueno de uno malo, donde un argumento es la **justificación de una sentencia** [Apuntes Jorge].

Fundamento: el **Cálculo de Predicados de Primer Orden (CP1o)** describe cualquier sentencia matemática; como toda función es una sentencia y todo algoritmo se escribe con funciones parcialmente computables, **todo algoritmo se escribe en CP1o**. Un lenguaje lógico = equivalente a CP1o + gramática compilable + ejecución como demostración (en tiempo polinomial).

Un **algoritmo lógico** es un conjunto finito de sentencias (FBF como base) que se quieren demostrar con recursos y tiempo finitos: se le pregunta al **motor** si otra sentencia es verdadera o falsa, y el motor hace la **evaluación veritativa / demostración** buscando en su base.

Por eso aquí **no hay instrucciones ni funciones evaluadas**: hay **sentencias lógicas (FBF)** y términos (predicados) que se demuestran.

| | Imperativo | Lógico |
|---|---|---|
| Operaciones | Instrucciones | Sentencias (FBF) |
| Acción | Ejecución | Demostración |
| Datos | Bytes en RAM | Variables lógicas |`},{h:"Variables lógicas y FBF",body:`La **variable lógica** existe antes que su tipo: primero existe, luego se determina su conjunto de pertenencia. Puede ligarse a un valor, desligarse y ligarse a otro de tipo distinto: son los individuos para los que un predicado es verdadero.

Es una **incógnita / placeholder** que se llena al demostrar [Apuntes Jorge]:

\`\`\`prolog
padre(Pedro, X)          % X = ¿quién es hijo de Pedro?
hermano(David, Juan)
hermano(David, Pedro)
hermano(David, X)        % X puede ser Juan o Pedro
\`\`\`

El motor busca los valores de X que hacen verdadera la sentencia. Una variable puede tomar **múltiples valores** por retroceso.

**FBF** = fórmulas bien formadas. No hay asignación: una variable se liga **una sola vez** por contexto de unificación. Ese es el cambio mental más difícil viniendo de C.`},{h:"Demostrar: el sistema de Copi",body:`Demostrar es partir de **premisas verdaderas** y aplicar **reglas de inferencia** hasta la conclusión. El sistema de Copi (visto en Matemática Discreta) tiene:

- 9 reglas de inferencia
- 10 reglas de sustitución
- 4 reglas de cuantificación
- 2 reglas de negación del cuantificador
- (opcional) 4 reglas de igualdad

Pero es **muy poco práctico** para una computadora [POR-VERIFICAR: "los algoritmos con Copi son NP"].`},{h:"Alternativas prácticas",body:`Dos familias con menos reglas y menos operadores [POR-VERIFICAR: "con restricciones son de tipo P"]:

- **Modus ponens**: dos operadores y una sola regla (MP).
- **Cálculo de cláusulas**: sin operadores y una sola regla, la **resolución con unificación**.

La **unificación** hace encajar dos términos ligando variables: es el corazón del paradigma. El **backtracking** prueba una rama, falla y retrocede a la siguiente. Corte (\`!\`) y \`fail\`: [VACÍO: sin fuente en el material].`},{h:"Cláusulas de Horn y Tres Amigas [Guía Jorge]",body:`Prolog restringe a **Cláusulas de Horn** (a lo sumo un literal positivo: \`A ← B1 ∧ … ∧ Bn\`); la **resolución SLD** busca eficiente con unificación y retroceso. [Simplificación de la guía.]

El acertijo Tres Amigas (Beatriz/María/Alicia; García/López/Méndez; ingeniera/actriz/maestra) se modela así:

\`\`\`prolog
amiga(beatriz, A1, P1)
Apellidos = [garcia, lopez, mendez]
A1 \\= garcia
member(amiga(_, lopez, ingeniera), Amigas)
member(amiga(maria, _, actriz), Amigas)
\\+ member(amiga(_, mendez, maestra), Amigas)
% Res = Beatriz López ingeniera, María Méndez actriz, Alicia García maestra.
\`\`\`

Con una restricción contradictoria, el backtracking agota ramas y responde **false**.`},{h:"Typeclasses frente a herencia [Guía Jorge]",body:"Java: polimorfismo por **subtipado y herencia** (class Perro extends Animal). Haskell: sin objetos ni herencia; las **typeclasses** son contratos donde cualquier tipo se adhiere sin modificar su definición (polimorfismo ad-hoc desacoplado)."}]}],h=[{id:"q01",u:"u1",type:"single",q:"¿Cuál es la definición de algoritmo del curso?",opts:["Una lista infinita de tareas sobre datos infinitos","Conjunto de tareas finitas, sobre datos finitos, en tiempo finito, con recursos finitos","Cualquier programa escrito en un lenguaje Turing completo","Una demostración lógica a partir de premisas verdaderas"],answer:1,why:"Las cuatro finitudes (tareas, datos, tiempo, recursos) son la definición del slide «Definición más general de algoritmo». Las otras opciones rompen alguna finitud o son de otro paradigma.",ref:"U1 · Definición de algoritmo"},{id:"q02",u:"u1",type:"multi",q:"¿Cuáles son las cuatro estructuras de Böhm-Jacopini?",opts:["Ejecución secuencial","Herencia múltiple","Iteración","Ejecución condicional","Separación modular","Unificación"],answer:[0,2,3,4],why:"El teorema afirma que cualquier algoritmo se construye con esas cuatro. Herencia es de OO y unificación es del paradigma lógico.",ref:"U1 · Böhm-Jacopini"},{id:"q03",u:"u1",type:"single",q:"La tesis de Church afirma que…",opts:["Todo lenguaje debe tener 4 paradigmas","Toda función computable es Turing-computable y las formas de computabilidad son equivalentes","Todo algoritmo necesita una máquina virtual","La semántica la genera el compilador"],answer:1,why:"Es el enunciado del cuaderno p2. La última opción es una formulación incorrecta detectada en el material [POR-VERIFICAR].",ref:"U1 · Church-Turing"},{id:"q04",u:"u1",type:"tf",q:"Un lenguaje Turing completo puede expresar cualquier algoritmo. (Justifica)",answer:!0,why:"Verdadero: esa es la universalidad. La forma informal de comprobarla es que el lenguaje permita recursión o manejo de pilas.",ref:"U1 · Universalidad"},{id:"q05",u:"u1",type:"single",q:"En `r = m*i + s` (reales + entero i), ¿qué ambigüedad formal aparece?",opts:["El dangling else","El orden de evaluación y las conversiones de tipo entero↔flotante","La falta de pattern matching","El backtracking"],answer:1,why:"Hay dos ambigüedades: suma vs. multiplicación primero, y convertir i a flotante o m a entero. Se resuelven con reglas metalingüísticas.",ref:"U1 · No-ambigüedad"},{id:"q06",u:"u1",type:"single",q:'El problema del "dangling else" consiste en…',opts:["Un else sin ningún if previo","No saber a cuál if pertenece un else","Un error de tipos en tiempo de ejecución","Una división por cero diferida"],answer:1,why:"Es la ambigüedad clásica citada en clase; cada lenguaje la fija con una regla (normalmente el else se asocia al if más cercano).",ref:"U1 · No-ambigüedad"},{id:"q07",u:"u1",type:"tf",q:"La eficiencia nunca puede sacrificarse por portabilidad o claridad. (Justifica)",answer:!1,why:"Falso: la eficiencia es relativizable. Ejemplo: asumir una máquina virtual como intérprete por portabilidad aunque cueste rendimiento.",ref:"U1 · Eficiencia"},{id:"q08",u:"u1",type:"single",q:"La depurabilidad exige…",opts:["Que el programa nunca tenga bugs","Una correspondencia clara entre diseño, implementación y depuración","Usar solo lenguajes interpretados","Eliminar todos los comentarios"],answer:1,why:"Depurar es encontrar rápido el código de cada pieza conceptual; sin esa biyección el mantenimiento se vuelve costoso.",ref:"U1 · Depurabilidad"},{id:"q09",u:"u1",type:"multi",q:"La tríada CIA de seguridad de la información es…",opts:["Privacidad","Disponibilidad","Integridad","Velocidad"],answer:[0,1,2],why:"Privacidad (solo autorizados ven), disponibilidad (siempre accesible a autorizados) e integridad (nadie no autorizado modifica).",ref:"U1 · Seguridad"},{id:"q10",u:"u1",type:"single",q:"«El compilador revisa la sintaxis y genera el ejecutable». Esa frase equivale a…",opts:["Revisa sintaxis y genera la pragmática","Revisa sintaxis y produce el comportamiento (semántica) en máquina","Revisa la pragmática y genera sintaxis","Ninguna: el compilador no revisa nada"],answer:1,why:"Verifica que el programa cumpla la gramática y emite código máquina que implementa su comportamiento esperado.",ref:"U1 · Sintaxis/semántica"},{id:"q11",u:"u1",type:"fill",q:"Completa: en el lenguaje de la clase, la sintaxis es la ______ (una sola palabra).",answer:"forma",accept:["forma","la forma"],why:"La sintaxis es la forma: las reglas para construir expresiones válidas. (La semántica es el significado/comportamiento y la pragmática el uso.)",ref:"U1 · Sintaxis/semántica/pragmática"},{id:"q12",u:"u1",type:"single",q:'¿Cuál de estos usos de la asignación es pragmática de "comunicar valores"?',opts:["Calcular una vez y reutilizar el temporal","Pasar valores entre partes del programa (parámetros o mensajes)","Actualizar un acumulador en un ciclo","Modificar una estructura de datos"],answer:1,why:"Los cuatro son usos pragmáticos documentados; comunicar valores corresponde a parámetros/mensajes.",ref:"U1 · Pragmática"},{id:"q31",u:"u2",type:"single",q:"En el paradigma imperativo, las tareas son…",opts:["Sentencias que se demuestran","Funciones que se evalúan","Instrucciones que se ejecutan como órdenes","Mensajes entre objetos"],answer:2,why:"Ejecución imperativa: en el fondo son órdenes y cada una debe ejecutarse. Las otras opciones son del lógico, funcional y OO.",ref:"U2 · Idea imperativa"},{id:"q32",u:"u2",type:"single",q:"Según el cuaderno, en COBOL no hay calls: la llamada a un párrafo es…",opts:["Una función de primera clase",'Un salto al "párrafo" que lo llamó',"Una unificación","Un mensaje"],answer:1,why:"Así lo registra el apunte [sic en la redacción]. Es coherente con la época sin llamadas estructuradas modernas.",ref:"U2 · COBOL"},{id:"q33",u:"u2",type:"single",q:"Asignación y comparación en Pascal y en C:",opts:["Pascal = y ==; C := y =","Pascal := y =; C = y ==","Ambos usan = y ==","Ambos usan := y ="],answer:1,why:"Pascal asigna con := y compara con =; C asigna con = y compara con ==. [El cuaderno invierte los símbolos de Pascal: por verificar.]",ref:"U2 · Comparativa"},{id:"q34",u:"u2",type:"multi",q:"¿Qué lenguajes permiten funciones anidadas según el cuaderno?",opts:["Pascal","C","COBOL"],answer:[0],why:"Pascal sí; C no. De COBOL el apunte no registra anidadas sino párrafos.",ref:"U2 · Comparativa"},{id:"q35",u:"u2",type:"single",q:"Variables locales, globales y dinámicas viven en…",opts:["Heap, pila, data segment","Pila/registro, data segment, heap","Data segment, heap, pila","Registro, heap, pila"],answer:1,why:"Locales en pila/registro (mueren con el módulo), globales en data segment (estáticas), dinámicas en heap (GC).",ref:"U2 · Life span"},{id:"q36",u:"u2",type:"tf",q:"Se busca acoplamiento alto y cohesión baja. (Justifica)",answer:!1,why:"Falso: es al revés. Coupling bajo (módulos poco enlazados) y cohesión alta (cada módulo hace una sola cosa coherente).",ref:"U2 · Coupling/cohesión"},{id:"q37",u:"u2",type:"single",q:'El apunte rotula "Binding: coherencia semántica…". ¿Qué es realmente?',opts:["Binding (asociación de nombres)","Cohesión (se busca alta)","Acoplamiento (se busca bajo)","Polimorfismo"],answer:1,why:"Por su contenido (hacer una sola cosa coherente, buscarlo alto) es cohesión, no binding. [POSIBLE CONFUSIÓN del apunte.]",ref:"U2 · Cohesión"},{id:"q38",u:"u2",type:"single",q:"El producto cartesiano se implementa como…",opts:["Array en los tres","Record (Pascal), struct (C), nivel 01 (COBOL)","Lista en los tres","Puntero en los tres"],answer:1,why:'Cada lenguaje le da su constructor; como el array es casi el único compuesto nativo, el resto se construye "a pie".',ref:"U2 · Compuestos"},{id:"q39",u:"u2",type:"single",q:"Diferencia entre while y repeat/do-while:",opts:["Ninguna, son sinónimos","while pregunta antes; repeat hace y después pregunta","repeat pregunta antes; while después","Solo existe while en imperativos"],answer:1,why:"while <cond> verifica primero (0 o más veces); repeat-until ejecuta y luego pregunta (1 o más).",ref:"U2 · Control"},{id:"q40",u:"u2",type:"single",q:"Función vs procedimiento (definición de clase):",opts:["No hay diferencia","Función abstrae una expresión constante; procedimiento abstrae un grupo de instrucciones","Procedimiento abstrae una expresión; función un grupo de instrucciones","Ambos abstraen tipos de datos"],answer:1,why:"Función: <var> ← expresión. Procedimiento: grupo de instrucciones con efecto.",ref:"U2 · Módulos"},{id:"q13",u:"u3",type:"single",q:"En notación prefija, a+b*c se escribe…",opts:["(a + b * c)","(+ a (* b c))","(* (+ a b) c)","(+ (* a b) c)"],answer:1,why:"El operador va primero y cada subexpresión es una lista: (+ a (* b c)). Así la precedencia queda fijada por construcción.",ref:"U3 · Notación prefija"},{id:"q14",u:"u3",type:"single",q:"¿Qué hace `(quote (5 2 3))` en Scheme?",opts:["Suma 5+2+3","Trata la lista como dato literal, sin evaluarla como llamada","Define una función sin nombre","Devuelve la cabeza de la lista"],answer:1,why:"quote cita literalmente: convierte esos valores en dato. Sin quote, el 5 se interpretaría como operador.",ref:"U3 · Scheme"},{id:"q15",u:"u3",type:"single",q:"car y cdr de (5 2 3) devuelven…",opts:["5 y (2 3)","(2 3) y 5","5 y 3","3 y (5 2)"],answer:0,why:"car da la cabeza, cdr da la cola (el resto sin la cabeza).",ref:"U3 · Listas"},{id:"q16",u:"u3",type:"single",q:"Diferencia entre Int e Integer en Haskell:",opts:["Ninguna, son sinónimos","Int es de 32 bits y rápido; Integer es de precisión arbitraria pero más lento","Integer es de 32 bits; Int es arbitrario","Int solo sirve para listas"],answer:1,why:"Es la distinción de clase: para matemática rigurosa conviene Integer/Haskell frente a lenguajes imperativos.",ref:"U3 · Haskell"},{id:"q17",u:"u3",type:"fill",q:"En `longitud (_:xs) = 1 + longitud xs`, el símbolo `_` significa…",answer:"anonima",accept:["anonima","anónima","variable anonima","variable anónima","wildcard","comodin","comodín"],why:"Es la variable anónima: el valor de la cabeza no se usa en el cuerpo.",ref:"U3 · Pattern matching"},{id:"q18",u:"u3",type:"single",q:"¿Por qué hailstoneSeq no necesita un condicional para el caso 1?",opts:["Porque Haskell no tiene condicionales","Por pattern matching: el caso base se declara como ecuación propia","Porque usa lazy evaluation","Porque las listas son infinitas"],answer:1,why:"El despacho por forma del dato reemplaza al if para el caso base.",ref:"U3 · Pattern matching"},{id:"q19",u:"u3",type:"single",q:"«Las variables, al obtener un resultado, ya no pueden cambiar». Esto significa que…",opts:["Hay que declararlas como constantes","No son celdas de memoria reasignables: se vuelven constantes tras evaluarse","No existen variables en funcionales","Son globales por defecto"],answer:1,why:"En funcionales una variable no es un repositorio apuntable con punteros; (* b c) se computa, se usa y desaparece (memoria dinámica).",ref:"U3 · Variables"},{id:"q20",u:"u3",type:"single",q:"sqr(n)=n*n con n=m+1, m=6. En orden-normal…",opts:["Se evalúa m+1 una vez y da 49","Se evalúa (m+1)*(m+1); da 49 pero evaluando dos veces","Da 36","No termina"],answer:1,why:"Orden-normal liga n a la expresión sin evaluar y la reevalúa en cada uso: (6+1)×(6+1)=49. Mismo resultado que eager, menos eficiente.",ref:"U3 · Evaluación"},{id:"q21",u:"u3",type:"single",q:"cand((n>0),(t/n>50)) con n=0, t=80. Evaluación ansiosa…",opts:["Devuelve False sin problemas","Falla por división entre cero","Devuelve True","Entra en ciclo infinito"],answer:1,why:"Eager evalúa ambos argumentos antes de llamar: t/n>50 divide por cero y el programa muere. En orden-normal daría False.",ref:"U3 · cand"},{id:"q22",u:"u3",type:"tf",q:"cand es estricta en sus dos argumentos. (Justifica)",answer:!1,why:"Falso: cand solo es estricta en el primero; el segundo a veces se ignora (rama else). sqr sí es estricta en n.",ref:"U3 · Estrictez"},{id:"q23",u:"u3",type:"single",q:"La evaluación perezosa combina…",opts:["Eager + efectos laterales","Orden-normal + memoización del primer cómputo","Compilación + interpretación","Recursión + iteración"],answer:1,why:"Evalúa al primer requerimiento, guarda el valor y lo reutiliza; coincide con orden-normal gracias a Church-Rosser.",ref:"U3 · Lazy"},{id:"q24",u:"u3",type:"single",q:"La propiedad de Church-Rosser exige…",opts:["Que el lenguaje sea imperativo","Ausencia de efectos laterales (funciones puras)","Variables globales","Punteros"],answer:1,why:"Con efectos laterales (ej. getint en C) distintos órdenes dan distintos resultados y la propiedad se pierde.",ref:"U3 · Church-Rosser"},{id:"q25",u:"u3",type:"single",q:"Polimorfismo paramétrico significa que…",opts:["La función acepta cualquier cantidad de argumentos","La función no restringe a priori el tipo de sus argumentos","El lenguaje no tiene tipos","Todo es un objeto"],answer:1,why:"Instancia la teoría lógica de funciones: una misma definición sirve para varios tipos.",ref:"U3 · Polimorfismo"},{id:"q26",u:"u4",type:"single",q:"En el paradigma lógico, los programas son…",opts:["Instrucciones que se ejecutan","Funciones que se evalúan","Sentencias (FBF) que se demuestran","Objetos que se envían mensajes"],answer:2,why:"No hay instrucciones ni evaluación: hay sentencias lógicas y demostración veritativa desde premisas.",ref:"U4 · Idea central"},{id:"q27",u:"u4",type:"single",q:"La variable lógica se diferencia de la imperativa en que…",opts:["Ocupa más bytes en RAM","Existe antes que su tipo y se liga una vez por unificación, sin reasignación","Siempre es global","Solo admite enteros"],answer:1,why:"Primero existe, luego se determina su conjunto; puede desligarse y religarse a otro tipo. En Prolog no se reasigna.",ref:"U4 · Variables"},{id:"q28",u:"u4",type:"multi",q:"El sistema de Copi consta de…",opts:["9 reglas de inferencia","10 reglas de sustitución","4 reglas de cuantificación","2 reglas de negación del cuantificador","1 regla de resolución"],answer:[0,1,2,3],why:"Ese es el conteo de clase (+4 opcionales de igualdad). La resolución única es del cálculo de cláusulas, no de Copi.",ref:"U4 · Copi"},{id:"q29",u:"u4",type:"single",q:"Las dos alternativas prácticas a Copi son…",opts:["Herencia y polimorfismo","Modus ponens y cálculo de cláusulas con resolución+unificación","Eager y lazy evaluation","Compiladores e intérpretes"],answer:1,why:'Menos reglas y operadores: MP (2 operadores, 1 regla) y cláusulas (sin operadores, resolución). [POR-VERIFICAR la afirmación "son de tipo P"].',ref:"U4 · Alternativas"},{id:"q30",u:"u4",type:"single",q:"La unificación es…",opts:["El orden de las cláusulas en el programa","Hacer encajar dos términos asignando variables","La poda de búsqueda con !","Un tipo de dato compuesto"],answer:1,why:"Es el corazón de Prolog: ligar variables para que dos términos coincidan. El corte (!) y fail: [VACÍO: sin fuente].",ref:"U4 · Unificación"},{id:"q41",u:"u1",type:"single",q:"¿Cómo favorece la ortogonalidad a la confiabilidad?",opts:["Aumentando las palabras reservadas","Reduciendo reglas especiales y excepciones que memorizar","Eliminando el chequeo de tipos","Prohibiendo la recursión"],answer:1,why:"Alta ortogonalidad = pocas reglas especiales → menos errores imprevistos. Pero en exceso y mal regulada puede permitir combinaciones extrañas.",ref:"U1 · Ortogonalidad [Guía Jorge S3C2]"},{id:"q42",u:"u1",type:"single",q:"¿Cómo resuelve un parser moderno el dangling else sin cambiar la gramática?",opts:["Duplicando el if","Dando preferencia a shift en conflictos shift/reduce (else al if más cercano)","Eliminando el else","Con evaluación perezosa"],answer:1,why:"Regla de desambiguación en la tabla del parser: ante shift/reduce se prefiere shift y el else se asocia al if inmediato.",ref:"U1 · Dangling else [Guía Jorge S3C2]"},{id:"q43",u:"u1",type:"single",q:"La capa morfológica se materializa en…",opts:["El parser","El analizador léxico (scanner): agrupa caracteres en tokens","El garbage collector","El linker"],answer:1,why:"El scanner lee caracteres y produce tokens, descartando blancos y comentarios (herramientas típicas: Lex/Flex).",ref:"U1 · Capas [Guía Jorge S3C2]"},{id:"q44",u:"u1",type:"single",q:"Semántica estática vs dinámica:",opts:["No existe tal distinción","Estática: lo validable compilando (tipos, ámbitos); dinámica: el significado al ejecutar y cómo cambia la memoria","Estática es en ejecución; dinámica en compilación","Ambas requieren ejecutar el programa"],answer:1,why:"Tipos y declaraciones se verifican sin correr el programa; el comportamiento temporal de la memoria solo existe en ejecución.",ref:"U1 · Semántica [Guía Jorge S3C2]"},{id:"q45",u:"u2",type:"single",q:"Paso por valor, por referencia y por nombre difieren en…",opts:["La velocidad del compilador","Copia sin efecto / dirección con mutación y aliasing / sustitución textual reevaluada (Jensen)","El número de palabras reservadas","El paradigma al que pertenecen"],answer:1,why:"Valor copia; referencia comparte (muta y crea alias); nombre sustituye el texto y reevalúa en cada uso, como el Dispositivo de Jensen en Algol 60.",ref:"U2 · Parámetros [Guía Jorge S4C1]"},{id:"q46",u:"u2",type:"single",q:"Para eliminar un goto según Böhm-Jacopini se introduce…",opts:["Más gotos","Una bandera booleana dentro de un while subordinado a un if","Recursión mutua","Un garbage collector"],answer:1,why:"El ejercicio resuelto convierte saltos en while + if-then-else con variable de estado (continuar), con única entrada y salida.",ref:"U2 · goto [Guía Jorge S3C1]"},{id:"q47",u:"u2",type:"single",q:"El Dispositivo de Jensen demuestra que el paso por nombre…",opts:["Copia el valor una vez","Reevalúa la expresión en cada iteración con el k actual","Es idéntico al paso por valor","No existe en ningún lenguaje"],answer:1,why:"Sum(i,1,100,A[i]): expr se evalúa cada ciclo con el nuevo k. Potente pero costoso y sorprendente.",ref:"U2 · Jensen [Guía Jorge S4C1]"},{id:"q48",u:"u3",type:"single",q:"¿Por qué lo funcional puro escala en paralelo sin locks?",opts:["Porque es más rápido","Porque sin estado mutable no hay carreras ni deadlocks sobre memoria compartida","Porque usa más hilos","Porque compila a ensamblador"],answer:1,why:"Razas e interbloqueos nacen de leer/mutar lo compartido; sin mutación, evaluar en paralelo es seguro. [Afirmación fuerte de la guía.]",ref:"U3 · Concurrencia [Guía Jorge S6C1]"},{id:"q49",u:"u3",type:"single",q:"La memoización es segura solo si…",opts:["La función es recursiva","Hay transparencia referencial: mismo input, mismo output siempre","El lenguaje es compilado","Se usa mucha memoria"],answer:1,why:"Guardar resultados y reutilizarlos exige que f(x) nunca cambie; con estado global mutable sería incorrecto.",ref:"U3 · Memoización [Guía Jorge S6C1]"},{id:"q50",u:"u3",type:"single",q:"Currificar significa que…",opts:["Toda función es de un solo parámetro: A→B→C es A→(B→C)","Las funciones no tienen tipos","Todo es una lista","No hay aplicación parcial"],answer:1,why:"Al dar el primer argumento se obtiene otra función a la espera del siguiente; así duplicar = (*) 2.",ref:"U3 · Currying [Guía Jorge S6C2]"},{id:"q51",u:"u3",type:"single",q:"Call-by-name vs call-by-need:",opts:["Son lo mismo","Ambos postergan; name reevalúa en cada uso, need memoiza en un thunk (máximo una vez)","Need es más lento siempre","Name memoiza y need no"],answer:1,why:"La diferencia es el grafo compartido con memoización: need evalúa como máximo una vez.",ref:"U3 · Evaluación [Guía Jorge S6C2]"},{id:"q52",u:"u3",type:"single",q:"Condición para que aplique TCO:",opts:["Que haya un if","Que la llamada recursiva sea la última operación, sin nada pendiente después","Que use listas","Que sea eager"],answer:1,why:"En n * fact(n-1) la multiplicación pendiente impide reutilizar el marco; con acumulador (factAux) sí aplica y cuesta O(1).",ref:"U3 · TCO [Guía Jorge S6C2]"},{id:"q53",u:"u3",type:"single",q:"Que String sea [Char] implica que…",opts:["Los strings son lentos","map/filter/fold y (:) sirven sobre texto, sin funciones especiales","No hay strings en Haskell","Todo string es infinito"],answer:1,why:'Sin división semántica texto/listas: take 4 "Programacion" da "Prog" y reverse "Haskell" da "lleksaH".',ref:"U3 · String [Guía Jorge S7C2]"},{id:"q54",u:"u4",type:"single",q:"¿Por qué las Cláusulas de Horn hicieron práctico a Prolog?",opts:["Porque tienen muchos operadores","Porque restringen a lo sumo un literal positivo y la resolución SLD busca eficiente con unificación y retroceso","Porque eliminan la unificación","Porque usan dominios infinitos"],answer:1,why:"La lógica general es intratable; Horn (A ← B1∧…∧Bn) permite búsqueda eficiente. [Simplificación fuerte de la guía.]",ref:"U4 · Horn [Guía Jorge S4C1]"},{id:"q55",u:"u4",type:"single",q:'Si a Tres Amigas agregamos "Beatriz es Maestra" (contradictorio), Prolog…',opts:["Se cuelga","Agota las ramas por backtracking y responde false (no satisfacible)","Ignora la restricción","Pide ayuda al usuario"],answer:1,why:"Ninguna sustitución satisface todas las cláusulas a la vez: el motor lo demuestra por agotamiento.",ref:"U4 · Backtracking [Guía Jorge S4C2]"},{id:"q56",u:"u1",type:"single",q:"Diferencia entre problema computable completo y parcialmente computable:",opts:["No hay diferencia","Completo: se detiene con cualquier entrada; parcial: solo garantiza detenerse con entrada válida","Parcial es más potente que completo","Completo nunca se detiene"],answer:1,why:"Parcialmente computable diverge (bucle infinito) con entrada inválida; completo siempre calcula y se detiene.",ref:"U1 · Computabilidad [Apuntes Jorge]"},{id:"q57",u:"u1",type:"multi",q:"Un procedimiento efectivo válido exige…",opts:["Número finito de tareas no ambiguas","Recursos y pasos finitos","Mismo resultado con misma entrada","Ejecutarse sin ingenio ni magia, solo siguiendo pasos"],answer:[0,1,2,3],why:"Son las 4 reglas de los apuntes. Cadena: Proceso Efectivo → Función Parcialmente Computable → Algoritmo.",ref:"U1 · Procedimiento efectivo [Apuntes Jorge]"},{id:"q58",u:"u1",type:"single",q:"Cálculo Lambda vs Máquina de Turing:",opts:["Son lo mismo","Lambda evalúa funciones por sustitución (base funcional); Turing lee cinta con estados hasta halt (base imperativa)","Lambda usa cinta; Turing usa funciones","Ninguno es Turing completo"],answer:1,why:"Church (funciones, sustitución) vs Turing (procedimental, cinta/estados/halt). La tesis Church-Turing los declara equivalentes.",ref:"U1 · Lambda/Turing [Apuntes Jorge]"},{id:"q59",u:"u1",type:"multi",q:"Características obligatorias de un lenguaje:",opts:["Universal (Turing completo; pila y recursión)","Implementable (traducción exacta a máquina-objeto)","No ambiguo","Gratuito"],answer:[0,1,2],why:"Universales, implementables y no ambiguos son obligatorias; naturales/eficientes/depurables/seguros son deseables.",ref:"U1 · Características [Apuntes Jorge]"},{id:"q60",u:"u1",type:"single",q:"Primer lenguaje imperativo y primer funcional según el timeline:",opts:["C y Haskell","Fortran (1954) y Lisp (1958)","COBOL y Prolog","Pascal y Scheme"],answer:1,why:"Fortran (Backus, IBM) primer imperativo de propósito general; Lisp (McCarthy, guía Church) primer funcional, base en listas, IA.",ref:"U1 · Timeline [Apuntes Jorge]"},{id:"q61",u:"u2",type:"single",q:"Binding estático vs dinámico:",opts:["No existe tal distinción","Estático: tipo grabado de inicio a fin (compilados, ej. Java); dinámico: tipo revisado en cada uso (interpretados, ej. Python)","Estático es en ejecución; dinámico en compilación","Ambos son cohesión"],answer:1,why:"Binding asocia identificador con valor en memoria; el momento distingue compilados de interpretados.",ref:"U2 · Binding [Apuntes Jorge]"},{id:"q62",u:"u2",type:"single",q:"¿Qué mató a los lenguajes imperativos clásicos?",opts:["Eran demasiado rápidos","Ninguno permite compartir la definición de una estructura junto con sus algoritmos de uso","Tenían pocas palabras reservadas","No usaban bytes"],answer:1,why:"Sin unir modelo + operaciones nace la OO. Fallas por lenguaje: COBOL sin dinámicas/verbose; Pascal E/S incómoda; C inseguro y con efectos en E/S.",ref:"U2 · Fin de imperativos [Apuntes Jorge]"},{id:"q63",u:"u3",type:"single",q:"Proy(1,3,5,8) y Cond(t,a,b) significan…",opts:["Proyección del 1.º (3) y condicional: si t verdadera → a, si no → b","Suma y resta","car y cdr","halt y loop"],answer:0,why:"Proy(k,…) retorna el k-ésimo; Cond modela el if funcional. Ej. MCD(m,n) = Cond(n mod m = 0, m, MCD(m, n mod m)).",ref:"U3 · Proy/Cond [Apuntes Jorge]"},{id:"q64",u:"u4",type:"single",q:"Con hermano(David,Juan) y hermano(David,Pedro), la consulta hermano(David,X)…",opts:["Falla siempre","Liga X primero a Juan y por retroceso a Pedro: múltiples valores","Solo da Juan","Da error de tipos"],answer:1,why:"La variable lógica es incógnita/placeholder; el motor busca todos los valores que hacen verdadera la sentencia.",ref:"U4 · Variable lógica [Apuntes Jorge]"},{id:"q65",u:"u1",type:"single",q:"Tipos simples por hardware vs basados en enteros:",opts:["No hay tipos simples","Hardware: BCD, Comp-2, flotante; en enteros: booleanos, caracteres, enumerados","Todos son compuestos","Solo existen archivos"],answer:1,why:"Compuestos: producto cartesiano, array, lista, unión, file.",ref:"U1 · Datos [Apuntes Jorge]"}],C=[{id:"f01",u:"u1",front:"Definición de algoritmo (4 finitudes)",back:"Conjunto de tareas finitas, sobre datos finitos, en tiempo finito, con recursos finitos."},{id:"f02",u:"u1",front:"Tesis de Church-Turing",back:"Toda función computable es Turing-computable; las formas de computabilidad son equivalentes."},{id:"f03",u:"u1",front:"Las 4 estructuras de Böhm-Jacopini",back:"Ejecución secuencial, iteración, ejecución condicional, separación modular."},{id:"f04",u:"u1",front:"Universalidad / implementabilidad / naturalidad",back:"Turing completo / traducción exacta a máquina-objeto / afinidad al dominio."},{id:"f05",u:"u1",front:"Sintaxis vs semántica vs pragmática",back:"Forma / comportamiento al ejecutar / uso en la práctica."},{id:"f06",u:"u1",front:"Dangling else",back:"Ambigüedad de a qué if pertenece un else; la resuelve una regla metalingüística."},{id:"f07",u:"u1",front:"Fórmula de Wirth",back:"Algorithms + Data Structures = Programs."},{id:"f08",u:"u1",front:"Ejemplo de función parcialmente computable",back:"f(x)=√x: exacta en E={0,1,4,9,…}, aproximada fuera."},{id:"f09",u:"u3",front:"Notación prefija de a+b*c",back:"(+ a (* b c))"},{id:"f10",u:"u3",front:"car / cdr",back:"Cabeza de la lista / resto (cola) de la lista."},{id:"f11",u:"u3",front:"quote",back:"Cita literal: (quote 5 2 3) es dato, no llamada."},{id:"f12",u:"u3",front:"Int vs Integer en Haskell",back:"Int: 32 bits, rápido. Integer: precisión arbitraria, más lento."},{id:"f13",u:"u3",front:"X:xs y _ en Haskell",back:"X cabeza, xs cola; _ variable anónima (valor no usado)."},{id:"f14",u:"u3",front:"Eager vs orden-normal vs lazy",back:"Evalúa en la llamada / al requerirse (quizá repetido) / al requerirse una vez y se guarda."},{id:"f15",u:"u3",front:"cand con n=0: ¿por qué difiere eager de orden-normal?",back:"Eager evalúa t/n>50 y divide por cero; orden-normal ignora el 2.º argumento y da false."},{id:"f16",u:"u3",front:"Church-Rosser (condición)",back:"Todos los órdenes dan el mismo resultado si no hay efectos laterales."},{id:"f17",u:"u3",front:"Función estricta",back:"La que siempre usa ese argumento (sqr en n; cand solo en el 1.º)."},{id:"f18",u:"u4",front:"Paradigma lógico en una frase",back:"Sentencias que se demuestran, no funciones que se evalúan ni instrucciones que se ejecutan."},{id:"f19",u:"u4",front:"Variable lógica vs imperativa",back:"Existe antes que su tipo y se liga una vez por unificación; no se reasigna."},{id:"f20",u:"u4",front:"Reglas del sistema de Copi",back:"9 de inferencia, 10 de sustitución, 4 de cuantificación, 2 de negación del cuantificador."},{id:"f21",u:"u4",front:"Las dos alternativas prácticas a Copi",back:"Modus ponens (2 operadores, 1 regla) y cálculo de cláusulas (resolución + unificación)."},{id:"f22",u:"u4",front:"Unificación",back:"Hacer encajar dos términos asignando variables."},{id:"f23",u:"u4",front:"Backtracking",back:"Probar una rama, fallar y retroceder a la siguiente alternativa."},{id:"f24",u:"u1",front:"CIA (seguridad)",back:"Privacidad, disponibilidad, integridad."},{id:"f25",u:"u2",front:"Ejecución imperativa",back:"Tareas = instrucciones; en el fondo son órdenes que se ejecutan una por una."},{id:"f26",u:"u2",front:"COBOL / Pascal / C: asignación y comparación",back:"COBOL: párrafos y PIC; Pascal := y =; C = y ==."},{id:"f27",u:"u2",front:"Life span: locales / globales / dinámicas",back:"Pila-registro / data segment / heap con GC."},{id:"f28",u:"u2",front:"Coupling vs cohesión (qué se busca)",back:'Acoplamiento bajo, cohesión alta. El apunte llama "binding" a la cohesión.'},{id:"f29",u:"u2",front:"Record / struct / nivel 01",back:"Producto cartesiano en Pascal / C / COBOL."},{id:"f30",u:"u2",front:"Función vs procedimiento",back:"Abstracción de expresión constante vs abstracción de grupo de instrucciones."},{id:"f31",u:"u1",front:"Ortogonalidad y confiabilidad [Guía Jorge]",back:"Pocas reglas especiales → menos errores; en exceso permite combinaciones extrañas."},{id:"f32",u:"u1",front:"Gramática G = (V_N, V_T, P, S) [Guía Jorge]",back:"No terminales, terminales, producciones, inicial. Ambigua si una cadena tiene 2+ árboles."},{id:"f33",u:"u2",front:"Valor / referencia / nombre [Guía Jorge]",back:"Copia / dirección con alias / sustitución reevaluada (Jensen)."},{id:"f34",u:"u3",front:"Call-by-name vs call-by-need [Guía Jorge]",back:"Ambos postergan; name reevalúa cada uso, need memoiza en thunk (máx. 1 vez)."},{id:"f35",u:"u3",front:"Condición TCO [Guía Jorge]",back:"Llamada recursiva última, sin nada pendiente; si no, O(n) de pila."},{id:"f36",u:"u4",front:"Cláusula de Horn [Guía Jorge]",b
